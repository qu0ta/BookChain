services:
  postgres:
    image: postgres:16-alpine
    container_name: bookchain-postgres
    restart: unless-stopped

    environment:
      POSTGRES_USER: bookchain
      POSTGRES_PASSWORD: bookchain
      POSTGRES_DB: bookchain
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bookchain -d bookchain"]
      interval: 5s
      timeout: 3s
      retries: 5
volumes:
  postgres_data:

